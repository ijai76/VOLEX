schema = 1
id = "volexstorm"
name = "VOLEXSTORM"
version = "2.0.1"
api = "0.1"
description = "Shadow-mapped sun and moon shadows, water that reflects and refracts and changes with the weather, leaves and grass in the wind, near-transparent rain, storm fog and a blue night."
authors = ["ZEI"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Sky"

[material]
file = "material.wgsl"
files = ["lighting.wgsl", "water.wgsl"]
name = "Lighting and water"

[vertex]
file = "vertex.wgsl"
name = "Wind and waves"

[weather]
file = "weather.wgsl"
name = "Rain and snow"

# The shadow pass draws the terrain in its square again each frame, so its cost grows with distance squared.
[shadow]
option = "shadows"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"
resolution = 2048
distance = 128.0
# Leaves cast whole shadows, whatever holes their texture has.
solid_materials = [1]

[reflection]
option = "reflections"

[[post]]
file = "post/finish.wgsl"
name = "Atmosphere and grade"

[budget]
gpu_ms = 3.0

[[tags]]
id = "water_flow"
sprites = ["block/water_flow"]

[[materials]]
id = 1
sprites = ["block/*_leaves"]

[[materials]]
id = 2
sprites = [
  "block/short_grass", "block/short_dry_grass", "block/tall_dry_grass", "block/fern", "block/bush",
  "block/dead_bush", "block/firefly_bush", "block/*_sapling", "block/dandelion", "block/poppy",
  "block/blue_orchid", "block/allium", "block/azure_bluet", "block/*_tulip", "block/oxeye_daisy",
  "block/cornflower", "block/lily_of_the_valley", "block/wither_rose", "block/torchflower",
  "block/wheat_stage*", "block/carrots_stage*", "block/potatoes_stage*", "block/beetroots_stage*",
  "block/sweet_berry_bush_stage*",
]

[[materials]]
id = 3
sprites = [
  "block/tall_grass_bottom", "block/large_fern_bottom", "block/sunflower_bottom", "block/lilac_bottom",
  "block/rose_bush_bottom", "block/peony_bottom", "block/pitcher_plant_bottom",
]

[[materials]]
id = 4
sprites = [
  "block/tall_grass_top", "block/large_fern_top", "block/sunflower_top", "block/sunflower_front",
  "block/sunflower_back", "block/lilac_top", "block/rose_bush_top", "block/peony_top",
  "block/pitcher_plant_top",
]

[[materials]]
id = 5
sprites = ["block/vine", "block/cave_vines*", "block/weeping_vines*", "block/twisting_vines*"]

[[lights]]
color = [1.0, 0.6, 0.3]
blocks = ["torch", "wall_torch", "lantern", "campfire", "fire", "jack_o_lantern", "*candle*", "furnace", "smoker", "blast_furnace"]

[[lights]]
color = [0.3, 0.7, 1.0]
blocks = ["soul_*"]

[[lights]]
color = [1.0, 0.25, 0.15]
blocks = ["redstone_torch", "redstone_wall_torch", "redstone_lamp", "redstone_ore", "deepslate_redstone_ore"]

[[lights]]
color = [1.0, 0.45, 0.12]
blocks = ["lava", "magma_block"]

[[lights]]
color = [1.0, 0.85, 0.5]
blocks = ["glowstone", "shroomlight", "ochre_froglight"]

[[lights]]
color = [0.6, 0.92, 1.0]
blocks = ["sea_lantern", "beacon", "conduit"]

[[lights]]
color = [0.72, 0.4, 1.0]
blocks = ["amethyst_cluster", "*_amethyst_bud", "crying_obsidian", "nether_portal", "respawn_anchor"]

[[lights]]
color = [0.5, 1.0, 0.55]
blocks = ["copper_torch", "copper_wall_torch", "copper_lantern", "verdant_froglight"]

[[lights]]
color = [0.92, 0.95, 1.0]
blocks = ["end_rod"]

[[pages]]
id = "main"
name = "VOLEXSTORM"
items = ["page:lighting", "page:water", "page:nature", "page:weather", "page:atmosphere", "page:camera"]

[[pages]]
id = "lighting"
name = "Lighting"
description = "Shadows, sunlight, sky light and block light."
items = ["shadows", "shadow_softness", "shadow_resolution", "shadow_distance", "sun_strength", "ambient_strength", "block_light_strength", "colored_lights", "ambient_occlusion"]

[[pages]]
id = "water"
name = "Water"
description = "Reflections, waves and how far you see into water."
items = ["reflections", "water_waves", "water_clarity"]

[[pages]]
id = "nature"
name = "Nature"
description = "Leaves and plants in the wind."
items = ["waving", "wave_strength", "foliage_tone"]

[[pages]]
id = "weather"
name = "Weather"
description = "Rain, wet ground and storm fog."
items = ["rain_look", "wet_surfaces", "fog_density"]

[[pages]]
id = "atmosphere"
name = "Atmosphere"
description = "The sky and the night."
items = ["sky_style", "night_mood"]

[[pages]]
id = "camera"
name = "Camera"
description = "Exposure and the colour grade."
items = ["exposure", "contrast", "saturation", "vignette"]

[[options]]
id = "shadows"
name = "Shadows"
description = "Shadows from the sun and the moon. Turning them off saves the most GPU time."
type = "bool"
default = true

[[options]]
id = "shadow_resolution"
name = "Shadow detail"
description = "The shadow map's size in texels."
type = "choice"
values = ["1024", "2048", "4096"]
default = "2048"

[[options]]
id = "shadow_distance"
name = "Shadow distance"
description = "How far from you, in blocks, things cast shadows. 128 is eight chunks."
type = "choice"
values = ["64", "96", "128", "160"]
default = "128"

[[options]]
id = "shadow_softness"
name = "Shadow edges"
description = "Sharp reads the shadow map once, soft four times and very soft nine times."
type = "choice"
values = ["Sharp", "Soft", "Very soft"]
default = "Soft"

[[options]]
id = "sun_strength"
name = "Sunlight"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "ambient_strength"
name = "Sky light"
description = "The light from the sky in the shade."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "block_light_strength"
name = "Block light"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[options]]
id = "colored_lights"
name = "Coloured light"
description = "Soul fire blue, redstone red, copper green."
type = "bool"
default = true

[[options]]
id = "ambient_occlusion"
name = "Contact shadows"
description = "Corners and creases are darker."
type = "float"
default = 0.6
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "reflections"
name = "Reflections"
description = "Water mirrors the world. Turning them off saves a half-resolution pass of the terrain."
type = "bool"
default = true

[[options]]
id = "water_waves"
name = "Waves"
type = "bool"
default = true

[[options]]
id = "water_clarity"
name = "Water clarity"
description = "How far you see into water."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "waving"
name = "Waving plants"
type = "bool"
default = true

[[options]]
id = "wave_strength"
name = "Wind"
type = "float"
default = 1.0
min = 0.0
max = 3.0
step = 0.1

[[options]]
id = "foliage_tone"
name = "Foliage colour"
description = "Negative gives a cooler green, positive a warmer one."
type = "float"
default = 0.3
min = -1.0
max = 1.0
step = 0.1

[[options]]
id = "rain_look"
name = "Rain transparency"
description = "Rain and snow streaks turn pale and almost transparent. 0 keeps vanilla."
type = "float"
default = 0.8
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "wet_surfaces"
name = "Wet ground"
description = "Wet blocks darken, puddles mirror the sky and the rain makes ripples."
type = "float"
default = 0.7
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "fog_density"
name = "Weather fog"
description = "Thin when clear, thicker in the rain, thick and dark in a thunderstorm. 0 turns it off."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "sky_style"
name = "Sky colour"
description = "0 is the vanilla sky, 1 a deeper blue with warm sunsets."
type = "float"
default = 0.8
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "night_mood"
name = "Night mood"
description = "Bluer, cooler nights with moonlight and a halo around the moon."
type = "float"
default = 0.7
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "exposure"
name = "Exposure"
type = "float"
default = 1.0
min = 0.5
max = 2.0
step = 0.05

[[options]]
id = "contrast"
name = "Contrast"
type = "float"
default = 1.1
min = 0.8
max = 1.4
step = 0.02

[[options]]
id = "saturation"
name = "Saturation"
type = "float"
default = 1.1
min = 0.5
max = 1.6
step = 0.02

[[options]]
id = "vignette"
name = "Vignette"
type = "float"
default = 0.25
min = 0.0
max = 1.0
step = 0.05
